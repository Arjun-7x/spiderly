# Render Blueprint: https://render.com/docs/infrastructure-as-code
# A persistent disk requires a paid instance type (free instances have none and
# also spin down when idle, which would kill running scans).
services:
  - type: web
    name: spiderly
    runtime: docker
    plan: starter
    healthCheckPath: /api/status
    envVars:
      # Random admin key generated by Render; read it in the dashboard (Environment tab).
      - key: SPIDERLY_API_KEY
        generateValue: true
      # Never let the scanner touch Render's private network or loopback.
      - key: SPIDERLY_ALLOW_PRIVATE
        value: "false"
      # REQUIRED: CIDRs / IPs of hosts YOU OWN and may scan, e.g. 203.0.113.10/32
      - key: SPIDERLY_ALLOWED_TARGETS
        sync: false
      # Your service URL, e.g. https://spiderly.onrender.com
      - key: SPIDERLY_ALLOWED_ORIGINS
        sync: false
      # Trust X-Forwarded-For from Render's proxy so rate limits are per real client.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: SPIDERLY_DB_PATH
        value: /data/spiderly.db
    disk:
      name: spiderly-data
      mountPath: /data
      sizeGB: 1
